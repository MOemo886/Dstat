<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Layer7 监控面板- Dstat&MO </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      :root {
        --primary-color: #4e73df;
        --secondary-color: #1cc88a;
        --background-color: #f8f9fc;
        --card-bg: #ffffff;
        --text-color: #5a5c69;
        --heading-color: #ff7675;
        --border-radius: 0.35rem;
        --shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
      }
      
      html, body {
        height: 100%;
        margin: 0;
        background-color: var(--background-color);
        color: var(--text-color);
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      .dashboard-container {
        padding: 1.5rem;
        max-width: 1400px;
        margin: 0 auto;
      }

      .dashboard-header {
        margin-bottom: 1.5rem;
      }

      .card {
        border: none;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        margin-bottom: 1.5rem;
      }

      .card-header {
        background-color: var(--card-bg);
        border-bottom: 1px solid #e3e6f0;
        padding: 1rem 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .card-header h5 {
        margin: 0;
        font-weight: 700;
        color: var(--heading-color);
      }

      .card-body {
        padding: 1.25rem;
      }

      .stats-card {
        text-align: center;
        padding: 1.5rem;
      }

      .stats-card .icon {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: var(--primary-color);
      }

      .stats-card .count {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .stats-card .label {
        font-size: 0.875rem;
        color: #858796;
        text-transform: uppercase;
      }

      #chart {
        width: 100%;
        height: 400px;
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
        color: var(--primary-color);
      }

      .footer {
        margin-top: 2rem;
        padding: 1rem 0;
        text-align: center;
        font-size: 0.875rem;
        color: #858796;
      }

      @media (max-width: 768px) {
        .dashboard-container {
          padding: 1rem;
        }
        #chart {
          height: 300px;
        }
      }
    </style>
  </head>

  <body>
    <div class="dashboard-container">
      <div class="dashboard-header">
        <nav class="navbar navbar-light">
          <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
              <i class="fas fa-chart-line"></i> Layer7 监控面板- Dstat&MO
            </span>
            <div class="d-flex">
              <span class="badge bg-primary" id="connection-status">
                <i class="fas fa-circle-notch fa-spin"></i> 正在连接...
              </span>
            </div>
          </div>
        </nav>
      </div>

      <div class="card">
        <div class="card-header">
          <h5><i class="fas fa-info-circle"></i> 监控信息</h5>
        </div>
        <div class="card-body">
          <p class="mb-0" id="info">正在获取监控信息...</p>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="card stats-card">
            <div class="icon">
              <i class="fas fa-tachometer-alt"></i>
            </div>
            <div class="count" id="current-rps">0</div>
            <div class="label">当前请求/秒</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stats-card">
            <div class="icon">
              <i class="fas fa-chart-bar"></i>
            </div>
            <div class="count" id="max-rps">0</div>
            <div class="label">最大请求/秒</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stats-card">
            <div class="icon">
              <i class="fas fa-history"></i>
            </div>
            <div class="count" id="avg-rps">0</div>
            <div class="label">平均请求/秒</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h5><i class="fas fa-chart-area"></i> 实时流量监控</h5>
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-primary active" id="view-1m">1分钟</button>
            <button type="button" class="btn btn-outline-primary" id="view-5m">5分钟</button>
            <button type="button" class="btn btn-outline-primary" id="view-15m">15分钟</button>
          </div>
        </div>
        <div class="card-body">
          <div id="chart"></div>
        </div>
      </div>

      <div class="footer">
        <p>基于 <a href="https://github.com/filippofinke/layer7-dstat" target="_blank">Layer7-DSTAT</a> 二次开发 | <span id="current-time"></span></p>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script>
      window.onload = () => {
        // 状态元素
        const info = document.getElementById("info");
        const connectionStatus = document.getElementById("connection-status");
        const currentRps = document.getElementById("current-rps");
        const maxRps = document.getElementById("max-rps");
        const avgRps = document.getElementById("avg-rps");
        const currentTime = document.getElementById("current-time");
        
        // 视图按钮
        const view1m = document.getElementById("view-1m");
        const view5m = document.getElementById("view-5m");
        const view15m = document.getElementById("view-15m");
        
        // 统计数据
        let maxRpsValue = 0;
        let totalRps = 0;
        let dataPoints = 0;
        let pointsLimit = 60; // 默认显示1分钟
        let lastRequestValue = 5; // 初始请求值
        
        // 更新时间显示
        function updateTime() {
          const now = new Date();
          currentTime.innerText = now.toLocaleString();
          setTimeout(updateTime, 1000);
        }
        updateTime();
        
        // 设置图表
        let chart = Highcharts.chart("chart", {
          chart: {
            type: "area",
            animation: Highcharts.svg,
            backgroundColor: "transparent",
            style: {
              fontFamily: "'Nunito', sans-serif"
            }
          },
          title: {
            text: null
          },
          time: {
            useUTC: false
          },
          credits: {
            enabled: false
          },
          xAxis: {
            type: "datetime",
            tickPixelInterval: 150
          },
          yAxis: {
            title: {
              text: "请求/秒"
            },
            plotLines: [{
              value: 0,
              width: 1,
              color: "#808080"
            }],
            min: 0
          },
          tooltip: {
            headerFormat: "<b>{series.name}</b><br/>",
            pointFormat: "{point.x:%Y-%m-%d %H:%M:%S}<br/>{point.y} 请求/秒"
          },
          legend: {
            enabled: false
          },
          exporting: {
            enabled: true
          },
          series: [{
            name: "HTTP请求",
            data: [],
            fillColor: {
              linearGradient: {
                x1: 0,
                y1: 0,
                x2: 0,
                y2: 1
              },
              stops: [
                [0, Highcharts.getOptions().colors[0]],
                [1, Highcharts.color(Highcharts.getOptions().colors[0]).setOpacity(0).get("rgba")]
              ]
            }
          }]
        });
        
        // 设置视图范围
        view1m.addEventListener("click", () => {
          setActiveView(view1m);
          pointsLimit = 60;
          trimData();
        });
        
        view5m.addEventListener("click", () => {
          setActiveView(view5m);
          pointsLimit = 300;
          trimData();
        });
        
        view15m.addEventListener("click", () => {
          setActiveView(view15m);
          pointsLimit = 900;
          trimData();
        });
        
        function setActiveView(activeBtn) {
          [view1m, view5m, view15m].forEach(btn => {
            btn.classList.remove("active");
          });
          activeBtn.classList.add("active");
        }
        
        function trimData() {
          if (chart.series[0].points.length > pointsLimit) {
            const pointsToRemove = chart.series[0].points.length - pointsLimit;
            for (let i = 0; i < pointsToRemove; i++) {
              chart.series[0].removePoint(0, false);
            }
            chart.redraw();
          }
        }

        // 显示静态信息
        info.innerText = "监控端点: https://dstat.moemo.link/dstat";
        
        // 模拟连接状态
        connectionStatus.innerHTML = '<i class="fas fa-check-circle"></i> 已连接';
        connectionStatus.classList.remove("bg-primary");
        connectionStatus.classList.add("bg-success");
        
        // 生成随机HTTP请求数据
        function generateRandomRequests() {
          // 生成平滑变化的随机值，最大变化幅度为上一个值的±2
          const variation = Math.floor(Math.random() * 5) - 2; // -2到2之间的随机数
          let requests = lastRequestValue + variation;
          
          // 确保请求数在1-10之间
          requests = Math.max(1, Math.min(10, requests));
          lastRequestValue = requests; // 保存当前值用于下次生成
          
          const time = new Date().getTime();
          
          // 创建浮动在请求点上的提示框
          const tooltipData = {
            x: time,
            y: requests,
            marker: {
              enabled: true
            }
          };
          
          if (requests > 0) {
            // 添加提示框显示请求详情
            const tooltipText = `HTTP请求<br>${new Date(time).toLocaleString('zh-CN', {hour: '2-digit', minute: '2-digit', second: '2-digit'})}<br>${requests} 请求/秒`;
            const label = chart.renderer.label(tooltipText, chart.plotWidth / 2, 50)
              .attr({
                padding: 8,
                r: 5,
                fill: 'rgba(255, 255, 255, 0.8)',
                zIndex: 6
              })
              .css({
                color: '#333333',
                fontSize: '12px'
              })
              .add();
              
            // 使用setTimeout手动移除标签而不是fadeOut
            setTimeout(() => {
              label.fadeOut ? label.fadeOut() : label.destroy();
            }, 2000);
          }
          
          // 更新统计数据
          currentRps.innerText = requests;
          
          if (requests > maxRpsValue) {
            maxRpsValue = requests;
            maxRps.innerText = maxRpsValue;
          }
          
          totalRps += requests;
          dataPoints++;
          avgRps.innerText = Math.round(totalRps / dataPoints);
          
          // 添加数据点
          const shift = chart.series[0].data.length > pointsLimit;
          chart.series[0].addPoint([time, requests], true, shift);
          
          // 每秒更新一次
          setTimeout(generateRandomRequests, 1000);
        }
        
        // 开始生成随机数据
        generateRandomRequests();
      };
    </script>
  </body>
</html>
